# This is a basic workflow to help you get started with Actions

name: make-build

on:
  push:
    branches: [ main ]
    
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: make push
      run: |
        docker login registry.hub.docker.com -u "${DOCKERHUB_USERNAME}" -p "${DOCKERHUB_PASSWORD}"
        docker login docker.io -u "${DOCKERHUB_USERNAME}" -p "${DOCKERHUB_PASSWORD}"
        make push REGISTRY=shelwin/ingress-nginx PLATFORMS=linux/amd64,linux/arm64
